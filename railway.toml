# Long-running Node API (recommended for OCR + lower DB latency vs Vercel).
# Deploy: connect GitHub repo → set env vars → Railway builds & runs start:prod.
# Pick a region close to your Postgres host (e.g. South Asia).

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate && npm run build"

[deploy]
startCommand = "npm run start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
